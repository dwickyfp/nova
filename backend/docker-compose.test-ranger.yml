# CI adds the existing Ranger control plane to its disposable engine project.
# Local acceptance reuses an already running Ranger through RANGER_ADMIN_URL.
services:
  ranger-db:
    extends:
      file: ../docker/docker-compose-engine.yml
      service: ranger-db
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-test-ranger-db

  ranger-solr:
    extends:
      file: ../docker/docker-compose-engine.yml
      service: ranger-solr
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-test-ranger-solr
    environment:
      SOLR_HEAP: 512m

  ranger-admin:
    extends:
      file: ../docker/docker-compose-engine.yml
      service: ranger-admin
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-test-ranger-admin
    # Keep FE/BE on their original single network so FE advertises an address
    # reachable by BE. Admin joins it for the service's JDBC connection.
    networks:
      - default
      - nova
      - ranger-policy

  ranger-bootstrap:
    extends:
      file: ../docker/docker-compose-engine.yml
      service: ranger-bootstrap
    container_name: ${COMPOSE_PROJECT_NAME:-backend}-test-ranger-bootstrap

volumes:
  ranger_db_data:
  ranger_solr_data:

networks:
  nova:
  ranger-policy:
