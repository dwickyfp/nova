# ═══════════════════════════════════════════════════════════════════
# Migration SOURCE cluster — an independent StarRocks 4.1.4 stack used
# to exercise the Migration Connector end-to-end against a *second*,
# genuinely separate cluster (not the Nova target engine).
#
#   MySQL from host:  mysql -h 127.0.0.1 -P 29040 -u root
#   HTTP from host:   http://localhost:28040
#
# Runs under its own compose project (`src`) so it never touches the
# nova-* / backend-* containers or their volumes.
# ═══════════════════════════════════════════════════════════════════

services:
  src-fe:
    image: starrocks/fe-ubuntu:4.1.4
    container_name: nova-mig-src-fe
    hostname: src-fe
    user: root
    command:
      - /bin/bash
      - -c
      - /opt/starrocks/fe/bin/start_fe.sh --host_type IP --logconsole
    ports:
      - "28040:8030"
      - "29040:9030"
    environment:
      - FE_QUERY_PORT=9030
      - AWS_EC2_METADATA_DISABLED=true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1 -P 9030 -u root -e "show frontends\G"
          | grep -q "Alive: true"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - srclab

  src-be:
    image: starrocks/be-ubuntu:4.1.4
    container_name: nova-mig-src-be
    hostname: src-be
    user: root
    command:
      - /bin/bash
      - -c
      - |
        set -e
        /opt/starrocks/be/bin/start_be.sh --logconsole &
        BE_IP="$$(hostname -i | awk '{print $$1}')"
        for i in $$(seq 1 60); do
          if mysql -h src-fe -P 9030 -u root \
               -e "ALTER SYSTEM ADD BACKEND '$$BE_IP:9050'" 2>/dev/null; then
            echo "registered BE $$BE_IP with FE"
            break
          fi
          sleep 2
        done
        wait
    depends_on:
      src-fe:
        condition: service_healthy
    environment:
      - FE_ADDRESS=src-fe:9010
      - AWS_EC2_METADATA_DISABLED=true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h src-fe -P 9030 -u root -e "SHOW BACKENDS\G"
          | grep -q "Alive: true"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - srclab

networks:
  srclab:
    name: nova-src-net
