[project]
name = "nova"
version = "0.1.0"
description = "Snowflake-grade management console for StarRocks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncmy>=0.2.11",
    "sqlalchemy[asyncio]>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "boto3>=1.36.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.3",
    "croniter>=6.0.0",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pyarrow>=19.0.0",
    "adbc-driver-flightsql>=1.5.0",
    "adbc-driver-manager>=1.5.0",
    "flaml[automl]>=2.3.6",
    "statsforecast>=2.0.1",
    "pyod>=2.0.5",
    "pandas>=2.2.3",
    "antlr4-python3-runtime==4.13.2",
    "pypdf>=6.0,<7.0",
    "pillow>=12.0,<13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-croniter>=6.0.0",
    "pre-commit>=4.0.0",
    { include-group = "test" },
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "engine: requires the real StarRocks/Redis/MinIO stack from docker-compose.test.yml",
    "slow: excluded from the fast local loop",
    "benchmark: deterministic microbenchmark; offline, no network, no engine",
    "eval: deterministic agentic-harness behaviour evaluation; offline, no network, no engine",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
# Report-only for now. The floor is enforced in CI once the measured baseline
# is stable; see docs/testing/STANDARD.md SS7. Do not add fail_under here before
# the baseline in the CI run summary is reviewed.
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.mypy]
# The vendored ANTLR parser is machine-generated from the pinned grammar and
# cannot satisfy mypy: `from antlr4 import *` has no stubs, so hundreds of names
# are unresolved, and its annotations are ANTLR's, not ours. Excluding it keeps
# the pre-existing hand-written baseline (see the mypy step in CI) readable
# instead of burying it under generated noise. The runtime import is verified by
# tests/unit/test_sql_dialect_grammar.py, which is the check that matters.
exclude = [
    "^app/sql_dialect/grammar/StarRocks(Lexer|Parser|Visitor)\\.py$",
]

[[tool.mypy.overrides]]
module = ["antlr4", "antlr4.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

# Same reasoning as [tool.mypy]: generated ANTLR output is not held to the
# hand-written style rules. It is verified by regeneration + diff in CI
# (.github/workflows/ci.yml, `grammar-drift`), which is a stronger check than
# linting it. The `__init__.py` next to it stays linted.
exclude = [
    "app/sql_dialect/grammar/StarRocksLexer.py",
    "app/sql_dialect/grammar/StarRocksParser.py",
    "app/sql_dialect/grammar/StarRocksVisitor.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
