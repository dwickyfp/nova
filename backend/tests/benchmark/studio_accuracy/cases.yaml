# Hand-written Studio accuracy cases. Time-range cases are generated in cases.py.
# See cases.py for the field meanings.

# ── dimensions ───────────────────────────────────────────────────────────────
- id: dim.city.en
  question: Revenue by city this month
  category: dimension
  expect: {metrics: [total_revenue], dimensions: [city], range: current_month}
- id: dim.city.id
  lang: id
  question: Penjualan per kota bulan ini
  category: dimension
  expect: {metrics: [total_revenue], dimensions: [city], range: current_month}
- id: dim.channel.en
  question: Orders by sales channel last month
  category: dimension
  expect: {metrics: [order_count], dimensions: [sales_channel], range: previous_month}
- id: dim.channel.id
  lang: id
  question: Jumlah pesanan per kanal bulan lalu
  category: dimension
  expect: {metrics: [order_count], dimensions: [sales_channel], range: previous_month}
- id: dim.segment.en
  question: Revenue by customer segment this year
  category: dimension
  expect: {metrics: [total_revenue], dimensions: [segment], range: current_year}
- id: dim.segment.id
  lang: id
  question: Omzet per segmen pelanggan tahun ini
  category: dimension
  expect: {metrics: [total_revenue], dimensions: [segment], range: current_year}
- id: dim.status.en
  question: Order count by order status last quarter
  category: dimension
  expect: {metrics: [order_count], dimensions: [status], range: previous_quarter}
- id: dim.category.units.en
  question: Units sold by product category this quarter
  category: dimension
  expect: {metrics: [units_sold], dimensions: [category], range: current_quarter}
- id: dim.category.units.id
  lang: id
  question: Unit terjual per kategori produk kuartal ini
  category: dimension
  expect: {metrics: [units_sold], dimensions: [category], range: current_quarter}
- id: dim.category.product_revenue.en
  question: Product revenue by category last month
  category: dimension
  expect: {metrics: [product_revenue], dimensions: [category], range: previous_month}
- id: dim.marketing.en
  question: Marketing spend by marketing channel this month
  category: dimension
  expect: {metrics: [marketing_spend_total], dimensions: [marketing_channel], range: current_month}
- id: dim.marketing.id
  lang: id
  question: Biaya marketing per kanal marketing bulan lalu
  category: dimension
  expect: {metrics: [marketing_spend_total], dimensions: [marketing_channel], range: previous_month}
- id: dim.two.en
  question: Revenue by city and sales channel last month
  category: dimension
  expect: {metrics: [total_revenue], dimensions: [city, sales_channel], range: previous_month}

