- id: model.unique_customers.en
  question: How many unique people bought something this year?
  category: paraphrase
  expect: {metrics: [customer_count], range: current_year}

# ── follow-ups (live runs) ───────────────────────────────────────────────────
- id: follow.breakdown_city.id
  lang: id
  turns: ["Berapa penjualan bulan ini?"]
  question: breakdown per kota dong
  category: follow_up
  expect: {metrics: [total_revenue], dimensions: [city], range: current_month}
- id: follow.change_period.en
  turns: ["Revenue by sales channel this month"]
  question: and last month?
  category: follow_up
  expect: {metrics: [total_revenue], dimensions: [sales_channel], range: previous_month}
- id: follow.filter.id
  lang: id
  turns: ["Penjualan per kanal tahun ini"]
  question: yang di Bandung aja
  category: follow_up
  expect: {metrics: [total_revenue], dimensions: [sales_channel], filters: {city: Bandung}, range: current_year}
- id: follow.metric_swap.en
  turns: ["Revenue by city last quarter"]
  question: Now show order count instead
  category: follow_up
  expect: {metrics: [order_count], dimensions: [city], range: previous_quarter}

# ── derived numbers (live runs: compute_metrics or verifier derivation) ─────
- id: derived.growth_mom.id
  lang: id
  question: Berapa persen pertumbuhan penjualan bulan lalu dibanding bulan sebelumnya?
  category: derived
  tags: [derived]
  expect: {metrics: [total_revenue], range: previous_month, compare: previous_period}
  answer: {kind: pct_change, from: previous_period, to: current_period}
- id: derived.share_city.en
  question: What share of this year's revenue came from Jakarta?
  category: derived
  tags: [derived]
  expect: {metrics: [total_revenue], dimensions: [city], range: current_year}
  answer: {kind: share, label: Jakarta}
- id: derived.delta_channel.id
  lang: id
  question: Selisih penjualan Website dan Marketplace bulan lalu berapa?
  category: derived
  tags: [derived]
  expect: {metrics: [total_revenue], dimensions: [sales_channel], range: previous_month}
  answer: {kind: difference, a: Website, b: Marketplace}

# ── share, rank, multi-fact (IR v2, phase 2) ────────────────────────────────
- id: ir2.share_city.en
  question: Share of revenue by city this year
  category: share
  phase: 2
  expect: {metrics: [total_revenue], dimensions: [city], range: current_year, transform: share_of_total}
- id: ir2.top_per_group.en
  question: Top 2 categories by product revenue in each city this quarter
  category: top_per_group
  phase: 2
  expect: {metrics: [product_revenue], dimensions: [city, category], range: current_quarter, top_n_per_group: {n: 2, partition_by: [city]}}
- id: ir2.having.id
  lang: id
  question: Kota dengan penjualan di atas 1 miliar tahun ini
  category: having
  phase: 2
  expect: {metrics: [total_revenue], dimensions: [city], range: current_year, having: {total_revenue: [">", 1000000000]}}
- id: ir2.multi_fact.en
  question: Marketing spend and revenue by channel this month
  category: multi_fact
  phase: 2
  expect: {metrics: [total_revenue, marketing_spend_total], dimensions: [sales_channel], range: current_month}

