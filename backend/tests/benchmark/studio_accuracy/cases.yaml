# ── paraphrases that need the model planner ─────────────────────────────────
- id: model.money_made.en
  question: How much money did we make last month?
  category: paraphrase
  expect: {metrics: [total_revenue], range: previous_month}
- id: model.laku.id
  lang: id
  question: Kota mana yang paling laku bulan ini?
  category: paraphrase
  expect: {metrics: [total_revenue], dimensions: [city], range: current_month, limit: 1}
- id: model.belanja_per_order.id
  lang: id
  question: Rata-rata belanja per transaksi kuartal lalu berapa?
  category: paraphrase
  expect: {metrics: [avg_order_value], range: previous_quarter}
- id: model.biggest_channel.en
  question: Which channel brought in the most sales last quarter?
  category: paraphrase
  expect: {metrics: [total_revenue], dimensions: [sales_channel], range: previous_quarter, limit: 1}
- id: model.pesanan_batal.id
  lang: id
  question: Ada berapa order yang dibatalkan bulan lalu?
  category: paraphrase
