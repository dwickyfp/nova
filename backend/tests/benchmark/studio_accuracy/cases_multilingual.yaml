# The same questions in eleven more languages. Each base expands to one case per
# language, id `ml.<base>.<lang>`, with the base's expectation. City and channel
# names are written the way a speaker of the language would write them.
languages: [es, pt, fr, de, ja, zh, ko, ar, vi, th, hi]

cases:
- base: rev_last_month
  category: time_range
  expect: {metrics: [total_revenue], range: previous_month}
  questions:
    es: ¿Cuáles fueron los ingresos totales del mes pasado?
    pt: Qual foi a receita total do mês passado?
    fr: Quel a été le chiffre d'affaires total le mois dernier ?
    de: Wie hoch war der Gesamtumsatz im letzten Monat?
    ja: 先月の総売上はいくらでしたか？
    zh: 上个月的总收入是多少？
    ko: 지난달 총매출은 얼마였나요?
    ar: كم كان إجمالي الإيرادات في الشهر الماضي؟
    vi: Tổng doanh thu tháng trước là bao nhiêu?
    th: รายได้รวมเดือนที่แล้วเท่าไร
    hi: पिछले महीने कुल राजस्व कितना था?

- base: orders_last_7_days
  category: time_range
  expect: {metrics: [order_count], range: last_7_days}
  questions:
    es: ¿Cuántos pedidos se hicieron en los últimos 7 días?
    pt: Quantos pedidos foram feitos nos últimos 7 dias?
    fr: Combien de commandes ont été passées au cours des 7 derniers jours ?
    de: Wie viele Bestellungen gab es in den letzten 7 Tagen?
    ja: 過去7日間の注文数は？
    zh: 过去7天有多少订单？
    ko: 최근 7일 동안 주문이 몇 건이었나요?
    ar: كم عدد الطلبات في آخر 7 أيام؟
    vi: Có bao nhiêu đơn hàng trong 7 ngày qua?
    th: มีคำสั่งซื้อกี่รายการใน 7 วันที่ผ่านมา
    hi: पिछले 7 दिनों में कितने ऑर्डर आए?

- base: rev_this_year
  category: time_range
  expect: {metrics: [total_revenue], range: current_year}
  questions:
    es: Ingresos totales de este año
    pt: Receita total deste ano
    fr: Chiffre d'affaires total de cette année
    de: Gesamtumsatz in diesem Jahr
    ja: 今年の総売上
    zh: 今年的总收入
    ko: 올해 총매출
    ar: إجمالي الإيرادات هذا العام
    vi: Tổng doanh thu năm nay
    th: รายได้รวมปีนี้
    hi: इस साल का कुल राजस्व

- base: aov_last_quarter
  category: synonym
  expect: {metrics: [avg_order_value], range: previous_quarter}
  questions:
    es: Valor promedio por pedido del trimestre pasado
    pt: Valor médio por pedido no trimestre passado
    fr: Panier moyen du trimestre dernier
    de: Durchschnittlicher Bestellwert im letzten Quartal
    ja: 前四半期の平均注文額
    zh: 上季度的平均订单金额
    ko: 지난 분기 평균 주문 금액
    ar: متوسط قيمة الطلب في الربع الماضي
    vi: Giá trị đơn hàng trung bình quý trước
    th: มูลค่าคำสั่งซื้อเฉลี่ยไตรมาสที่แล้ว
    hi: पिछली तिमाही का औसत ऑर्डर मूल्य

- base: rev_by_city_year
  category: dimension
  expect: {metrics: [total_revenue], dimensions: [city], range: current_year}
  questions:
    es: Ingresos por ciudad este año
    pt: Receita por cidade neste ano
    fr: Chiffre d'affaires par ville cette année
    de: Umsatz nach Stadt in diesem Jahr
    ja: 今年の都市別売上
    zh: 今年各城市的收入
    ko: 올해 도시별 매출
    ar: الإيرادات حسب المدينة هذا العام
    vi: Doanh thu theo thành phố năm nay
    th: รายได้แยกตามเมืองปีนี้
    hi: इस साल शहर के अनुसार राजस्व

- base: orders_by_channel_last_month
  category: dimension
  expect: {metrics: [order_count], dimensions: [sales_channel], range: previous_month}
  questions:
    es: Número de pedidos por canal de venta el mes pasado
    pt: Número de pedidos por canal de vendas no mês passado
    fr: Nombre de commandes par canal de vente le mois dernier
    de: Anzahl der Bestellungen pro Vertriebskanal im letzten Monat
    ja: 先月の販売チャネル別の注文数
    zh: 上个月各销售渠道的订单数
    ko: 지난달 판매 채널별 주문 수
    ar: عدد الطلبات حسب قناة البيع في الشهر الماضي
    vi: Số đơn hàng theo kênh bán hàng tháng trước
    th: จำนวนคำสั่งซื้อแยกตามช่องทางการขายเดือนที่แล้ว
    hi: पिछले महीने बिक्री चैनल के अनुसार ऑर्डर की संख्या

- base: units_by_category_quarter
  category: dimension
  expect: {metrics: [units_sold], dimensions: [category], range: current_quarter}
  questions:
    es: Unidades vendidas por categoría de producto este trimestre
    pt: Unidades vendidas por categoria de produto neste trimestre
    fr: Unités vendues par catégorie de produit ce trimestre
    de: Verkaufte Einheiten nach Produktkategorie in diesem Quartal
    ja: 今四半期の商品カテゴリ別販売数量
    zh: 本季度按产品类别的销售数量
    ko: 이번 분기 제품 카테고리별 판매 수량
    ar: الوحدات المباعة حسب فئة المنتج هذا الربع
    vi: Số lượng bán theo danh mục sản phẩm quý này
    th: จำนวนหน่วยที่ขายได้แยกตามหมวดสินค้าไตรมาสนี้
    hi: इस तिमाही में उत्पाद श्रेणी के अनुसार बिकी इकाइयाँ

- base: rev_jakarta_year
  category: filter
  expect: {metrics: [total_revenue], filters: {city: Jakarta}, range: current_year}
  questions:
    es: Ingresos en Yakarta este año
    pt: Receita em Jacarta neste ano
    fr: Chiffre d'affaires à Jakarta cette année
    de: Umsatz in Jakarta in diesem Jahr
    ja: 今年のジャカルタの売上
    zh: 今年雅加达的收入
    ko: 올해 자카르타 매출
    ar: الإيرادات في جاكرتا هذا العام
    vi: Doanh thu tại Jakarta năm nay
    th: รายได้ในจาการ์ตาปีนี้
    hi: इस साल जकार्ता में राजस्व

- base: orders_mobile_last_month
  category: filter
  expect: {metrics: [order_count], filters: {sales_channel: Mobile App}, range: previous_month}
  questions:
    es: Pedidos desde la aplicación móvil el mes pasado
    pt: Pedidos pelo aplicativo móvel no mês passado
    fr: Commandes passées via l'application mobile le mois dernier
    de: Bestellungen über die mobile App im letzten Monat
    ja: 先月のモバイルアプリからの注文数
    zh: 上个月来自移动应用的订单数
    ko: 지난달 모바일 앱 주문 수
    ar: الطلبات عبر تطبيق الجوال في الشهر الماضي
    vi: Số đơn hàng từ ứng dụng di động tháng trước
    th: คำสั่งซื้อจากแอปมือถือเดือนที่แล้ว
    hi: पिछले महीने मोबाइल ऐप से आए ऑर्डर

- base: rev_mom
  category: comparison
  expect: {metrics: [total_revenue], range: current_month, compare: month_over_month}
  questions:
    es: Ingresos de este mes comparados con el mes pasado
    pt: Receita deste mês em comparação com o mês passado
    fr: Chiffre d'affaires de ce mois comparé au mois dernier
    de: Umsatz in diesem Monat im Vergleich zum Vormonat
    ja: 今月の売上を先月と比較して
    zh: 本月收入与上月相比
    ko: 이번 달 매출을 지난달과 비교해줘
    ar: قارن إيرادات هذا الشهر بالشهر الماضي
    vi: Doanh thu tháng này so với tháng trước
    th: รายได้เดือนนี้เทียบกับเดือนที่แล้ว
    hi: इस महीने के राजस्व की तुलना पिछले महीने से करें

- base: rev_ytd_yoy
  category: comparison
  expect: {metrics: [total_revenue], range: ytd, compare: year_over_year}
  questions:
    es: Ingresos del año hasta la fecha frente al mismo periodo del año pasado
    pt: Receita acumulada no ano em comparação com o mesmo período do ano passado
    fr: Chiffre d'affaires depuis le début de l'année par rapport à la même période l'an dernier
    de: Umsatz seit Jahresbeginn im Vergleich zum Vorjahreszeitraum
    ja: 年初来の売上を前年同期と比較
    zh: 年初至今的收入与去年同期相比
    ko: 연초 이후 누적 매출을 작년 같은 기간과 비교
    ar: الإيرادات منذ بداية العام مقارنة بالفترة نفسها من العام الماضي
    vi: Doanh thu từ đầu năm đến nay so với cùng kỳ năm ngoái
    th: รายได้ตั้งแต่ต้นปีถึงปัจจุบันเทียบกับช่วงเดียวกันของปีที่แล้ว
    hi: साल की शुरुआत से अब तक का राजस्व, पिछले साल की इसी अवधि की तुलना में

- base: top3_cities_year
  category: ranking
  expect: {metrics: [total_revenue], dimensions: [city], range: current_year, limit: 3}
  questions:
    es: Las 3 ciudades con más ingresos este año
    pt: As 3 cidades com maior receita neste ano
    fr: Les 3 villes qui ont généré le plus de chiffre d'affaires cette année
    de: Die 3 umsatzstärksten Städte in diesem Jahr
    ja: 今年売上上位3都市
    zh: 今年收入最高的前3个城市
    ko: 올해 매출 상위 3개 도시
    ar: أعلى 3 مدن من حيث الإيرادات هذا العام
    vi: 3 thành phố có doanh thu cao nhất năm nay
    th: 3 เมืองที่มีรายได้สูงสุดปีนี้
    hi: इस साल सबसे ज़्यादा राजस्व वाले 3 शहर

- base: best_channel_last_quarter
  category: ranking
  expect: {metrics: [total_revenue], dimensions: [sales_channel], range: previous_quarter, limit: 1}
  questions:
    es: ¿Qué canal de venta generó más ingresos el trimestre pasado?
    pt: Qual canal de vendas gerou mais receita no trimestre passado?
    fr: Quel canal de vente a généré le plus de chiffre d'affaires le trimestre dernier ?
    de: Welcher Vertriebskanal hatte im letzten Quartal den höchsten Umsatz?
    ja: 前四半期に最も売上が高かった販売チャネルは？
    zh: 上季度哪个销售渠道的收入最高？
    ko: 지난 분기에 매출이 가장 높은 판매 채널은?
    ar: ما قناة البيع التي حققت أعلى إيرادات في الربع الماضي؟
    vi: Kênh bán hàng nào có doanh thu cao nhất quý trước?
    th: ช่องทางการขายใดมีรายได้สูงสุดในไตรมาสที่แล้ว
    hi: पिछली तिमाही में किस बिक्री चैनल का राजस्व सबसे ज़्यादा था?

- base: top2_category_each_city
  category: top_per_group
  phase: 2
  expect: {metrics: [product_revenue], dimensions: [city, category], range: current_quarter, top_n_per_group: {n: 2, partition_by: [city]}}
  questions:
    es: Las 2 categorías con más ingresos por producto en cada ciudad este trimestre
    pt: As 2 categorias com maior receita de produtos em cada cidade neste trimestre
    fr: Les 2 catégories avec le plus de chiffre d'affaires produit dans chaque ville ce trimestre
    de: Die 2 Kategorien mit dem höchsten Produktumsatz in jeder Stadt in diesem Quartal
    ja: 今四半期の各都市で商品売上上位2カテゴリ
    zh: 本季度每个城市产品收入最高的前2个类别
    ko: 이번 분기 도시별 제품 매출 상위 2개 카테고리
    ar: أعلى فئتين من حيث إيرادات المنتجات في كل مدينة هذا الربع
    vi: 2 danh mục có doanh thu sản phẩm cao nhất ở mỗi thành phố quý này
    th: 2 หมวดสินค้าที่มีรายได้สินค้าสูงสุดในแต่ละเมืองไตรมาสนี้
    hi: इस तिमाही हर शहर में उत्पाद राजस्व के हिसाब से शीर्ष 2 श्रेणियाँ

- base: cities_above_1b
  category: having
  phase: 2
  expect: {metrics: [total_revenue], dimensions: [city], range: current_year, having: {total_revenue: [">", 1000000000]}}
  questions:
    es: Ciudades con ingresos superiores a 1.000 millones este año
    pt: Cidades com receita acima de 1 bilhão neste ano
    fr: Villes dont le chiffre d'affaires dépasse 1 milliard cette année
    de: Städte mit einem Umsatz von über 1 Milliarde in diesem Jahr
    ja: 今年売上が10億を超えた都市
    zh: 今年收入超过10亿的城市
    ko: 올해 매출이 10억을 넘은 도시
    ar: المدن التي تجاوزت إيراداتها مليار هذا العام
    vi: Các thành phố có doanh thu trên 1 tỷ năm nay
    th: เมืองที่มีรายได้เกิน 1 พันล้านในปีนี้
    hi: इस साल 1 अरब से ज़्यादा राजस्व वाले शहर

- base: share_by_city
  category: share
  phase: 2
  expect: {metrics: [total_revenue], dimensions: [city], range: current_year, transform: share_of_total}
  questions:
    es: Participación de los ingresos por ciudad este año
    pt: Participação da receita por cidade neste ano
    fr: Part du chiffre d'affaires par ville cette année
    de: Umsatzanteil nach Stadt in diesem Jahr
    ja: 今年の都市別売上構成比
    zh: 今年各城市的收入占比
    ko: 올해 도시별 매출 비중
    ar: حصة الإيرادات حسب المدينة هذا العام
    vi: Tỷ trọng doanh thu theo thành phố năm nay
    th: สัดส่วนรายได้แยกตามเมืองปีนี้
    hi: इस साल शहर के अनुसार राजस्व में हिस्सेदारी

- base: spend_and_revenue_by_channel
  category: multi_fact
  phase: 2
  expect: {metrics: [total_revenue, marketing_spend_total], dimensions: [sales_channel], range: current_month}
  questions:
    es: Gasto en marketing e ingresos por canal este mes
    pt: Gasto com marketing e receita por canal neste mês
    fr: Dépenses marketing et chiffre d'affaires par canal ce mois-ci
    de: Marketingausgaben und Umsatz nach Kanal in diesem Monat
    ja: 今月のチャネル別マーケティング費用と売上
    zh: 本月各渠道的营销支出和收入
    ko: 이번 달 채널별 마케팅 비용과 매출
    ar: الإنفاق التسويقي والإيرادات حسب القناة هذا الشهر
    vi: Chi phí marketing và doanh thu theo kênh tháng này
    th: ค่าใช้จ่ายการตลาดและรายได้แยกตามช่องทางเดือนนี้
    hi: इस महीने चैनल के अनुसार मार्केटिंग खर्च और राजस्व

- base: growth_last_month
  category: derived
  tags: [derived]
  expect: {metrics: [total_revenue], range: previous_month, compare: previous_period}
  answer: {kind: pct_change, from: previous_period, to: current_period}
  questions:
    es: ¿En qué porcentaje cambiaron los ingresos el mes pasado respecto al mes anterior?
    pt: Em quantos por cento a receita mudou no mês passado em relação ao mês anterior?
    fr: De quel pourcentage le chiffre d'affaires a-t-il évolué le mois dernier par rapport au mois précédent ?
    de: Um wie viel Prozent hat sich der Umsatz im letzten Monat gegenüber dem Vormonat verändert?
    ja: 先月の売上は前月比で何パーセント変化しましたか？
    zh: 上个月收入比前一个月变化了百分之多少？
    ko: 지난달 매출은 그 전달 대비 몇 퍼센트 변했나요?
    ar: بكم في المئة تغيرت الإيرادات في الشهر الماضي مقارنة بالشهر الذي قبله؟
    vi: Doanh thu tháng trước thay đổi bao nhiêu phần trăm so với tháng trước đó?
    th: รายได้เดือนที่แล้วเปลี่ยนแปลงกี่เปอร์เซ็นต์เมื่อเทียบกับเดือนก่อนหน้า
    hi: पिछले महीने राजस्व उससे पहले वाले महीने की तुलना में कितने प्रतिशत बदला?

- base: diff_website_marketplace
  category: derived
  tags: [derived]
  expect: {metrics: [total_revenue], dimensions: [sales_channel], range: previous_month}
  answer: {kind: difference, a: Website, b: Marketplace}
  questions:
    es: ¿Cuál es la diferencia de ingresos entre Website y Marketplace el mes pasado?
    pt: Qual é a diferença de receita entre Website e Marketplace no mês passado?
    fr: Quelle est la différence de chiffre d'affaires entre Website et Marketplace le mois dernier ?
    de: Wie groß ist der Umsatzunterschied zwischen Website und Marketplace im letzten Monat?
    ja: 先月のWebsiteとMarketplaceの売上の差は？
    zh: 上个月Website和Marketplace的收入差是多少？
    ko: 지난달 Website와 Marketplace의 매출 차이는?
    ar: ما الفرق في الإيرادات بين Website و Marketplace في الشهر الماضي؟
    vi: Chênh lệch doanh thu giữa Website và Marketplace tháng trước là bao nhiêu?
    th: ส่วนต่างรายได้ระหว่าง Website กับ Marketplace เดือนที่แล้วเท่าไร
    hi: पिछले महीने Website और Marketplace के राजस्व में कितना अंतर था?

- base: rev_orders_by_channel_month
  category: multi_metric
  expect: {metrics: [total_revenue, order_count], dimensions: [sales_channel], range: current_month}
  questions:
    es: Ingresos y número de pedidos por canal de venta este mes
    pt: Receita e número de pedidos por canal de vendas neste mês
    fr: Chiffre d'affaires et nombre de commandes par canal de vente ce mois-ci
    de: Umsatz und Anzahl der Bestellungen nach Vertriebskanal in diesem Monat
    ja: 今月の販売チャネル別の売上と注文数
    zh: 本月各销售渠道的收入和订单数
    ko: 이번 달 판매 채널별 매출과 주문 수
    ar: الإيرادات وعدد الطلبات حسب قناة البيع هذا الشهر
    vi: Doanh thu và số đơn hàng theo kênh bán hàng tháng này
    th: รายได้และจำนวนคำสั่งซื้อแยกตามช่องทางการขายเดือนนี้
    hi: इस महीने बिक्री चैनल के अनुसार राजस्व और ऑर्डर की संख्या

- base: monthly_rev_this_year
  category: time_grain
  expect: {metrics: [total_revenue], range: current_year, grain: month}
  questions:
    es: Ingresos mensuales de este año
    pt: Receita mensal deste ano
    fr: Chiffre d'affaires mensuel de cette année
    de: Monatlicher Umsatz in diesem Jahr
    ja: 今年の月別売上
    zh: 今年每月的收入
    ko: 올해 월별 매출
    ar: الإيرادات الشهرية لهذا العام
    vi: Doanh thu theo tháng năm nay
    th: รายได้รายเดือนของปีนี้
    hi: इस साल का मासिक राजस्व

- base: customers_this_month
  category: synonym
  expect: {metrics: [customer_count], range: current_month}
  questions:
    es: ¿Cuántos clientes distintos compraron este mes?
    pt: Quantos clientes distintos compraram neste mês?
    fr: Combien de clients distincts ont acheté ce mois-ci ?
    de: Wie viele verschiedene Kunden haben in diesem Monat gekauft?
