name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-pg:
    name: PostgreSQL 17 metadata boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Build pinned metadata test runtime and transaction pooler
        timeout-minutes: 8
        run: docker build -f docker/metadata-test.Dockerfile -t nova-metadata-test:ci .
      - name: Prepare private TLS fixture
        working-directory: backend
        run: uv run python tests/integration/prepare_metadata_fixture.py "$RUNNER_TEMP/nova-metadata-pg"
      - name: Start disposable PostgreSQL
        run: |
          docker compose ls
          docker ps --format '{{.Names}}'
          docker compose -p nova-metadata-ci -f "$RUNNER_TEMP/nova-metadata-pg/compose.yaml" up -d --wait
      - name: Verify metadata transactions and security boundaries
        run: |
          mkdir -m 700 "$RUNNER_TEMP/nova-metadata-report"
          docker run --rm -i --network host --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            -e RUNNER_TEMP \
            -v "$RUNNER_TEMP/nova-metadata-pg:$RUNNER_TEMP/nova-metadata-pg:ro" \
            -v "$RUNNER_TEMP/nova-metadata-report:/reports" \
            nova-metadata-test:ci - <<'PY'
          import json
          import os
          from pathlib import Path
          import pytest
          configuration = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "nova-metadata-pg/connection.json").read_text()
          )
          os.environ["NOVA_TEST_METADATA_ADMIN_DSN"] = configuration["admin_dsn"]
          os.environ["NOVA_TEST_METADATA_DISPOSABLE"] = "acknowledged"
          raise SystemExit(pytest.main([
              "tests/integration/test_metadata_pg_foundation.py",
              "tests/integration/test_metadata_bootstrap.py",
              "tests/integration/test_metadata_pgbouncer.py",
              "tests/integration/test_metadata_preferences.py",
              "tests/integration/test_metadata_ai_registry.py",
              "tests/integration/test_metadata_model_aliases.py",
              "tests/integration/test_metadata_ai_configuration.py",
              "tests/integration/test_metadata_audit.py",
              "tests/integration/test_metadata_retained_legacy.py",
              "tests/integration/test_metadata_retired_agents.py",
              "tests/integration/test_metadata_stages.py",
              "tests/integration/test_metadata_workspaces.py",
              "tests/integration/test_metadata_workspace_files.py",
              "tests/integration/test_metadata_workspace_service.py",
              "tests/integration/test_metadata_notebooks.py",
              "tests/integration/test_metadata_tasks.py",
              "tests/integration/test_metadata_intelligence.py",
              "tests/integration/test_metadata_jobs.py",
              "tests/integration/test_metadata_scheduler.py",
              "tests/integration/test_metadata_migrator.py", "-v",
              "-p", "no:cacheprovider", "--junit-xml=/reports/metadata-pg.xml",
          ]))
          PY
      - name: Refuse skipped or empty acceptance
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          report = Path(os.environ["RUNNER_TEMP"]) / "nova-metadata-report/metadata-pg.xml"
          suites = list(ET.parse(report).getroot().iter("testsuite"))
          assert sum(int(s.attrib["tests"]) for s in suites) > 0, "No PG tests executed"
          for suite in suites:
              assert all(int(suite.attrib[k]) == 0 for k in ("failures", "errors", "skipped")), suite.attrib
          PY
      - name: Scan database logs for credential canaries
        if: always()
        working-directory: backend
        run: |
          umask 077
          docker compose -p nova-metadata-ci -f "$RUNNER_TEMP/nova-metadata-pg/compose.yaml" \
            logs --no-color nova-metadata-db > "$RUNNER_TEMP/nova-metadata-server.log" 2>&1
          uv run python tests/integration/check_metadata_logs.py "$RUNNER_TEMP/nova-metadata-server.log" \
            > "$RUNNER_TEMP/nova-metadata-report/log-scan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-pg-report
          path: |
            ${{ runner.temp }}/nova-metadata-report/metadata-pg.xml
            ${{ runner.temp }}/nova-metadata-report/log-scan.json
      - name: Remove this job's disposable database
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nova-metadata-pg/compose.yaml" ]; then
            docker compose -p nova-metadata-ci -f "$RUNNER_TEMP/nova-metadata-pg/compose.yaml" down --volumes
          fi

  backend-static:
    name: Backend static (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff-scoped ruff step below diffs against the base SHA, which
          # `fetch-depth: 1` does not contain. Without the full history that
          # diff fails with "bad object <sha>" and the step used to treat the
          # failure as "no changed files" and pass — the blocking check never
          # ran on any PR.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: ruff (full tree, report-only)
        working-directory: backend
        run: uv run ruff check . || true

      # Blocking, diff-scoped. `main` carries a large ruff baseline that
      # predates this gate; making it blocking outright would fail on day one
      # for debt this workstream did not create. New and changed Python files
      # must be clean, and the baseline is burned down separately.
      - name: ruff (changed files, blocking)
        working-directory: backend
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision; skipping diff-scoped lint"
            exit 0
          fi
          # A failed diff must NOT be read as "nothing changed": that is how
          # this check silently passed before. `set -e` plus an explicit
          # existence check keeps a broken comparison loud.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::error::base revision $BASE is not in the checkout; the diff-scoped lint cannot run (fetch-depth must include it)"
            exit 1
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' | sed 's|^backend/||')
          if [ -z "$CHANGED" ]; then
            echo "no changed Python files"
            exit 0
          fi
          echo "$CHANGED"
          # `--force-exclude` so the pyproject exclusions (the generated ANTLR
          # parser under app/sql_dialect/grammar/) still apply to files named
          # explicitly on the command line. Without it, a generated file in the
          # diff would be linted and fail on machine-emitted formatting.
          uv run ruff check --force-exclude $CHANGED

      - name: mypy (blocking)
        working-directory: backend
        run: uv run mypy app --no-error-summary

  grammar-drift:
    # NOVA-54 PR 1. Two independent guarantees, both offline apart from the
    # ANTLR jar download:
    #
    #   1. the vendored .g4 files are still pinned to upstream and carry no
    #      edit outside a NOVA-BEGIN/END block (`check_grammar_drift.py`),
    #   2. the committed Python artifacts are byte-for-byte what the pinned
    #      grammar generates (`generate_grammar.sh` + `git diff --exit-code`).
    #
    # Java is build-time only; the runtime stays pure Python. This job is a
    # hard gate: a fuzzy grammar edit or a stale artifact must fail the build.
    name: Grammar drift (ANTLR regenerate-and-diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (ANTLR generator, build time only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Grammar pin + marked-changes-only drift check
        working-directory: backend
        run: uv run python scripts/check_grammar_drift.py

      - name: Regenerate the parser and require a byte-identical tree
        run: |
          # The generated artifacts are committed; regenerating them must be a
          # no-op. A diff means someone edited a generated file or forgot to
          # regenerate after changing a .g4 -- either way, fail loudly.
          bash backend/scripts/generate_grammar.sh
          if ! git diff --exit-code -- backend/app/sql_dialect/grammar; then
            echo "::error::committed ANTLR artifacts do not match the vendored grammar; run backend/scripts/generate_grammar.sh and commit the result"
            exit 1
          fi
          UNTRACKED=$(git ls-files --others --exclude-standard -- backend/app/sql_dialect/grammar)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::generator produced untracked files that are not committed:"
            echo "$UNTRACKED"
            exit 1
          fi

  backend-unit:
    name: Backend unit (L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UI validator runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: pytest unit with coverage
        working-directory: backend
        run: |
          uv run pytest tests/unit \
            --cov=app --cov-branch --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # Agentic-harness behaviour gate (NOVA-124). Deterministic and offline: a
      # scripted provider stands in for the model, so no provider key is needed.
      # Kept separate from the unit run so a harness-behaviour regression is
      # named in the job list rather than hidden inside the unit count.
      - name: Agent harness eval
        working-directory: backend
        run: uv run python -m tests.eval.report

      - name: Agent trajectory suite
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import os
          import secrets
          from cryptography.fernet import Fernet
          import pytest
          os.environ["FERNET_KEY"] = Fernet.generate_key().decode()
          os.environ["SECRET_KEY"] = secrets.token_urlsafe(32)
          raise SystemExit(pytest.main(["tests/eval", "-q", "--junit-xml=eval.xml"]))
          PY

      - name: Upload agent trajectory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-trajectories
          path: backend/eval.xml
          retention-days: 7
          if-no-files-found: ignore

      # Threshold is report-only in this first gate: the denominator is now
      # correct (include=app/**), the baseline is measured, but the floor is not
      # yet enforced. Flipping `--cov-fail-under` on is a follow-up once the
      # baseline in the run summary is stable.
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  backend-integration:
    name: Backend integration (L3, real engine)
    # Pinned: on the ubuntu-latest 26.04 image the compose engine stopped
    # accepting connections on 127.0.0.1:29030 within a minute of the suite
    # starting (run 41998251723), while the same stack completes on 24.04.
    runs-on: ubuntu-24.04
    needs: [backend-unit]
    env:
      NOVA_TEST_FE_HEAP_MB: "2048"
      COMPOSE_FILE: docker-compose.test.yml:docker-compose.test-ranger.yml
      RANGER_ADMIN_URL: http://127.0.0.1:6080
      RANGER_SERVICE_NAME: nova_starrocks_ci
      RANGER_USERNAME: admin
    steps:
      - uses: actions/checkout@v4

      - name: Install UI validator runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      # The proxy acceptance suite self-gates on a local `mysql:8.0` image
      # (test_mysql_proxy_cli.py:50-62) because it runs a *real* client against
      # the proxy. Without this the whole module skips, which is the vacuous
      # state this job exists to catch.
      - name: Pull the MySQL client image
        run: docker pull mysql:8.0

      - name: Generate disposable CI credentials
        run: |
          admin_password="CiA9$(openssl rand -hex 24)"
          db_password="CiD9$(openssl rand -hex 24)"
          signing_key="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -base64 32 | tr '+/' '-_')"
          bi_token="$(openssl rand -hex 32)"
          bi_db_password="CiS9$(openssl rand -hex 24)"
          bi_secret="$(openssl rand -hex 32)"
          sandbox_key="$(openssl rand -hex 32)"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$db_password"
          echo "::add-mask::$signing_key"
          echo "::add-mask::$encryption_key"
          echo "::add-mask::$bi_token"
          echo "::add-mask::$bi_db_password"
          echo "::add-mask::$bi_secret"
          echo "::add-mask::$sandbox_key"
          {
            echo "RANGER_ADMIN_PASSWORD=$admin_password"
            echo "RANGER_PASSWORD=$admin_password"
            echo "RANGER_DB_PASSWORD=$db_password"
            echo "SECRET_KEY=$signing_key"
            echo "FERNET_KEY=$encryption_key"
            # Compose also interpolates the unselected app-profile services
            # in the file from which the Ranger definitions are inherited.
            echo "NOVA_SECRET_KEY=$signing_key"
            echo "NOVA_FERNET_KEY=$encryption_key"
            echo "NOVA_SUPERSET_SERVICE_TOKEN=$bi_token"
            echo "SUPERSET_DB_PASSWORD=$bi_db_password"
            echo "SUPERSET_SECRET_KEY=$bi_secret"
            # The notebook sandbox server (not started here) refuses to run
            # without an API key, so Compose requires one to read the file.
            echo "NOVA_OPENSANDBOX_API_KEY=$sandbox_key"
          } >> "$GITHUB_ENV"

      - name: Start the real engine and Ranger control plane
        working-directory: backend
        run: |
          docker compose config --quiet
          docker compose up -d --wait starrocks-fe starrocks-be minio redis ranger-admin
          docker compose run --rm ranger-bootstrap

      - name: Verify authenticated Ranger service and policy revision
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import asyncio
          from app.integrations.ranger.client import ranger_client

          async def verify():
              health = await ranger_client.health()
              assert health["service_exists"], "Ranger service bootstrap is missing"
              assert await ranger_client.policy_revision(), "Ranger policy revision is unavailable"
              print("Authenticated Ranger service and policy revision are ready")

          asyncio.run(verify())
          PY

      # The suite assumes a populated environment and provisions none of it.
      # Same script a developer runs locally; see its header.
      - name: Seed the engine for the acceptance suite
        working-directory: backend
        run: bash tests/integration/seed_engine.sh

      - name: Run integration suite against real StarRocks/Redis/MinIO
        working-directory: backend
        env:
          # The engine is reached through the compose file's published ports,
          # not the app's localhost defaults (9030/6379/9000 all differ).
          # `engine_reachable` reads settings.STARROCKS_HOST/PORT and the proxy
          # calls db.init_system_pool() with the same values, so these have to
          # match docker-compose.test.yml.
          STARROCKS_HOST: 127.0.0.1
          STARROCKS_FE_MYSQL_PORT: "29030"
          REDIS_URL: redis://127.0.0.1:26379/0
          S3_ENDPOINT: http://127.0.0.1:29000
          # The suite runs a MySQL client container per query. Host networking
          # lets it reach the proxy bound in the pytest process at
          # 127.0.0.1:<ephemeral>, so no compose network name and no
          # host.docker.internal (injected by Docker Desktop, absent on the
          # runner's Engine) has to be involved.
          NOVA_PROXY_E2E_NETWORK: host
          NOVA_PROXY_E2E_HOST: 127.0.0.1
        run: |
          # Three distinct states, and only one of them is a pass:
          #
          #   (a) no test files at all         -> FAIL: missing suite is tracked debt
          #   (b) files exist, none collected  -> FAIL: a selection or import mistake
          #   (c) collected, but all skipped   -> FAIL: the engine was never used
          #
          # (c) is why this guard counts skips. pytest exits 0 when every test
          # skips, so a suite that never reached StarRocks would report green —
          # a vacuous pass, which is worse than a red failure: a red job gets
          # investigated, a green one ships. `-rs` prints every skip reason, so
          # "nothing ran" comes with the reason attached.
          #
          # `-m engine` selects the suites that need the real stack. Both files
          # under tests/integration carry the marker, so the filter is
          # meaningful rather than a deselect-everything no-op.
          set +e
          # `--log-cli-level=WARNING` surfaces the application's own warnings
          # in the job log. Without it pytest captures them and a failing
          # assertion only shows its symptom, not the pipeline state that
          # produced it — which cost several CI cycles on test_ac3.
          uv run pytest tests/integration -m engine -v -rs \
            --log-cli-level=WARNING --junit-xml=integration.xml
          status=$?
          set -e

          if [ ! -f integration.xml ]; then
            # pytest died before writing a report (bad option, collection
            # crash, interpreter error). Surface the exit code rather than
            # reading a missing file as "no tests".
            echo "::error::pytest produced no report (exit $status); see the log above"
            exit "${status:-1}"
          fi

          read -r collected skipped failures errors <<<"$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("integration.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          totals = {"tests": 0, "skipped": 0, "failures": 0, "errors": 0}
          for suite in suites:
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print(totals["tests"], totals["skipped"], totals["failures"], totals["errors"])
          PY
          )"

          echo "collected=$collected skipped=$skipped failures=$failures errors=$errors"

          # (a) and (b): nothing collected. Which message applies is decided by
          # whether test files exist, so the two states stay distinguishable
          # rather than collapsing into one.
          if [ "$collected" -eq 0 ]; then
            if [ -n "$(find tests/integration -name 'test_*.py' -print -quit)" ]; then
              echo "::error::test files exist but none were collected — a selection or import mistake, not a missing suite"
            else
              echo "::error::L3 suite missing — tests/integration holds no test files. Tracked debt (NOVA-28); do not clear this without adding the suite."
            fi
            exit 1
          fi

          # (c): collected, but every one skipped. The engine was not used.
          # pytest exits 0 here, so this is the only thing standing between a
          # suite that never ran and a green job.
          if [ "$skipped" -eq "$collected" ]; then
            echo "::error::all $collected collected tests skipped — the engine was never used. See the -rs reasons above; this is not a pass."
            exit 1
          fi

          exit "$status"

      - name: Dump compose logs on failure
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color || true

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration
          path: backend/integration.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down the engine stack
        if: always()
        working-directory: backend
        run: docker compose down -v || true

  frontend:
    name: Frontend (lint, build, vitest)
    runs-on: ubuntu-24.04
    container:
      # Match the locked Playwright package; this image supplies browser OS deps.
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned to the version that generated frontend/pnpm-lock.yaml, so
          # `--frozen-lockfile` cannot fail on a pnpm version skew between the
          # developer machine and CI.
          version: 11.8.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # The pnpm project is frontend/, not the repo root, so the cache key
          # must point at the lockfile explicitly. Without this, setup-node
          # looks for pnpm-lock.yaml at the root, fails to find it, and aborts
          # the job before the install step runs.
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the pinned Chromium runtime
        timeout-minutes: 2
        run: |
          node --input-type=module - <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          console.log(`Chromium ${browser.version()}`);
          await browser.close();
          JS

      - name: Intelligent UI catalog and validator drift
        run: pnpm ui:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

  superset:
    name: Superset integration (image build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Nova Superset image
        run: docker build -f superset/Dockerfile -t nova-superset:ci .

      # The web image (web app, bootstrap, beat) carries no browser; only the
      # worker's `jobs` image draws thumbnails and report screenshots
      # (docs/operations/superset-lean-deployment.md).
      - name: Web image has no browser and loads Nova's configuration
        run: |
          docker build -f superset/Dockerfile --target web -t nova-superset-web:ci .
          docker run --rm --entrypoint sh nova-superset-web:ci -c \
            '! /app/.venv/bin/python -c "import playwright" 2>/dev/null && test ! -d /app/.playwright'
          docker run --rm -e SUPERSET_SECRET_KEY=ci-only-secret -e SUPERSET_DB_PASSWORD=ci-only-password \
            --entrypoint /app/.venv/bin/python nova-superset-web:ci \
            -c "import superset_config as c; assert c.CELERY_CONFIG.beat_schedule['reports.scheduler']['options']['expires'] < 60"

      # The package runs inside the pinned Superset release, so its tests do
      # too. The secrets are throwaway values for configuration import only.
      - name: nova_superset unit tests
        run: >-
          docker run --rm
          -e SUPERSET_SECRET_KEY=ci-only-secret
          -e SUPERSET_DB_PASSWORD=ci-only-password
          -v "$PWD/superset/tests:/app/nova-tests:ro"
          --entrypoint python nova-superset:ci
          -m unittest discover -s /app/nova-tests -v

  notebook-runtime:
    name: Notebook runtime image (build, kernel tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The kernel helpers run against the pinned DuckDB, Jupyter and Python
      # stack in the image, so their tests run there too. No Nova or network
      # is needed: Nova reads are covered by the backend and live checks.
      - name: Build the notebook runtime image
        run: docker build -t nova-notebook-runtime:ci docker/notebook-runtime

      - name: Kernel tests
        run: >-
          docker run --rm --entrypoint python nova-notebook-runtime:ci
          -m pytest -q -p no:cacheprovider /opt/nova/tests
