name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend static (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff-scoped ruff step below diffs against the base SHA, which
          # `fetch-depth: 1` does not contain. Without the full history that
          # diff fails with "bad object <sha>" and the step used to treat the
          # failure as "no changed files" and pass — the blocking check never
          # ran on any PR.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: ruff (full tree, report-only)
        working-directory: backend
        run: uv run ruff check . || true

      # Blocking, diff-scoped. `main` carries a large ruff baseline that
      # predates this gate; making it blocking outright would fail on day one
      # for debt this workstream did not create. New and changed Python files
      # must be clean, and the baseline is burned down separately.
      - name: ruff (changed files, blocking)
        working-directory: backend
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision; skipping diff-scoped lint"
            exit 0
          fi
          # A failed diff must NOT be read as "nothing changed": that is how
          # this check silently passed before. `set -e` plus an explicit
          # existence check keeps a broken comparison loud.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::error::base revision $BASE is not in the checkout; the diff-scoped lint cannot run (fetch-depth must include it)"
            exit 1
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' | sed 's|^backend/||')
          if [ -z "$CHANGED" ]; then
            echo "no changed Python files"
            exit 0
          fi
          echo "$CHANGED"
          # `--force-exclude` so the pyproject exclusions (the generated ANTLR
          # parser under app/sql_dialect/grammar/) still apply to files named
          # explicitly on the command line. Without it, a generated file in the
          # diff would be linted and fail on machine-emitted formatting.
          uv run ruff check --force-exclude $CHANGED

      # mypy carries a pre-existing 63-error baseline (see the job summary);
      # it is wired in and visible but not yet blocking.
      - name: mypy (report-only)
        working-directory: backend
        run: uv run mypy app --no-error-summary || true

  grammar-drift:
    # NOVA-54 PR 1. Two independent guarantees, both offline apart from the
    # ANTLR jar download:
    #
    #   1. the vendored .g4 files are still pinned to upstream and carry no
    #      edit outside a NOVA-BEGIN/END block (`check_grammar_drift.py`),
    #   2. the committed Python artifacts are byte-for-byte what the pinned
    #      grammar generates (`generate_grammar.sh` + `git diff --exit-code`).
    #
    # Java is build-time only; the runtime stays pure Python. This job is a
    # hard gate: a fuzzy grammar edit or a stale artifact must fail the build.
    name: Grammar drift (ANTLR regenerate-and-diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (ANTLR generator, build time only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Grammar pin + marked-changes-only drift check
        working-directory: backend
        run: uv run python scripts/check_grammar_drift.py

      - name: Regenerate the parser and require a byte-identical tree
        run: |
          # The generated artifacts are committed; regenerating them must be a
          # no-op. A diff means someone edited a generated file or forgot to
          # regenerate after changing a .g4 -- either way, fail loudly.
          bash backend/scripts/generate_grammar.sh
          if ! git diff --exit-code -- backend/app/sql_dialect/grammar; then
            echo "::error::committed ANTLR artifacts do not match the vendored grammar; run backend/scripts/generate_grammar.sh and commit the result"
            exit 1
          fi
          UNTRACKED=$(git ls-files --others --exclude-standard -- backend/app/sql_dialect/grammar)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::generator produced untracked files that are not committed:"
            echo "$UNTRACKED"
            exit 1
          fi

  backend-unit:
    name: Backend unit (L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: pytest unit with coverage
        working-directory: backend
        run: |
          uv run pytest tests/unit \
            --cov=app --cov-branch --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # Threshold is report-only in this first gate: the denominator is now
      # correct (include=app/**), the baseline is measured, but the floor is not
      # yet enforced. Flipping `--cov-fail-under` on is a follow-up once the
      # baseline in the run summary is stable.
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  backend-integration:
    name: Backend integration (L3, real engine)
    runs-on: ubuntu-latest
    needs: [backend-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      # The proxy acceptance suite self-gates on a local `mysql:8.0` image
      # (test_mysql_proxy_cli.py:50-62) because it runs a *real* client against
      # the proxy. Without this the whole module skips, which is the vacuous
      # state this job exists to catch.
      - name: Pull the MySQL client image
        run: docker pull mysql:8.0

      - name: Start the real engine stack
        working-directory: backend
        run: docker compose -f docker-compose.test.yml up -d --wait

      # The suite assumes a populated environment and provisions none of it.
      # Same script a developer runs locally; see its header.
      - name: Seed the engine for the acceptance suite
        working-directory: backend
        run: bash tests/integration/seed_engine.sh

      - name: Run integration suite against real StarRocks/Redis/MinIO
        working-directory: backend
        env:
          # The engine is reached through the compose file's published ports,
          # not the app's localhost defaults (9030/6379/9000 all differ).
          # `engine_reachable` reads settings.STARROCKS_HOST/PORT and the proxy
          # calls db.init_system_pool() with the same values, so these have to
          # match docker-compose.test.yml.
          STARROCKS_HOST: 127.0.0.1
          STARROCKS_FE_MYSQL_PORT: "29030"
          REDIS_URL: redis://127.0.0.1:26379/0
          S3_ENDPOINT: http://127.0.0.1:29000
          # The suite runs a MySQL client container per query. Host networking
          # lets it reach the proxy bound in the pytest process at
          # 127.0.0.1:<ephemeral>, so no compose network name and no
          # host.docker.internal (injected by Docker Desktop, absent on the
          # runner's Engine) has to be involved.
          NOVA_PROXY_E2E_NETWORK: host
          NOVA_PROXY_E2E_HOST: 127.0.0.1
        run: |
          # Three distinct states, and only one of them is a pass:
          #
          #   (a) no test files at all         -> FAIL: missing suite is tracked debt
          #   (b) files exist, none collected  -> FAIL: a selection or import mistake
          #   (c) collected, but all skipped   -> FAIL: the engine was never used
          #
          # (c) is why this guard counts skips. pytest exits 0 when every test
          # skips, so a suite that never reached StarRocks would report green —
          # a vacuous pass, which is worse than a red failure: a red job gets
          # investigated, a green one ships. `-rs` prints every skip reason, so
          # "nothing ran" comes with the reason attached.
          #
          # `-m engine` selects the suites that need the real stack. Both files
          # under tests/integration carry the marker, so the filter is
          # meaningful rather than a deselect-everything no-op.
          set +e
          # `--log-cli-level=WARNING` surfaces the application's own warnings
          # in the job log. Without it pytest captures them and a failing
          # assertion only shows its symptom, not the pipeline state that
          # produced it — which cost several CI cycles on test_ac3.
          uv run pytest tests/integration -m engine -v -rs \
            --log-cli-level=WARNING --junit-xml=integration.xml
          status=$?
          set -e

          if [ ! -f integration.xml ]; then
            # pytest died before writing a report (bad option, collection
            # crash, interpreter error). Surface the exit code rather than
            # reading a missing file as "no tests".
            echo "::error::pytest produced no report (exit $status); see the log above"
            exit "${status:-1}"
          fi

          read -r collected skipped failures errors <<<"$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("integration.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          totals = {"tests": 0, "skipped": 0, "failures": 0, "errors": 0}
          for suite in suites:
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print(totals["tests"], totals["skipped"], totals["failures"], totals["errors"])
          PY
          )"

          echo "collected=$collected skipped=$skipped failures=$failures errors=$errors"

          # (a) and (b): nothing collected. Which message applies is decided by
          # whether test files exist, so the two states stay distinguishable
          # rather than collapsing into one.
          if [ "$collected" -eq 0 ]; then
            if [ -n "$(find tests/integration -name 'test_*.py' -print -quit)" ]; then
              echo "::error::test files exist but none were collected — a selection or import mistake, not a missing suite"
            else
              echo "::error::L3 suite missing — tests/integration holds no test files. Tracked debt (NOVA-28); do not clear this without adding the suite."
            fi
            exit 1
          fi

          # (c): collected, but every one skipped. The engine was not used.
          # pytest exits 0 here, so this is the only thing standing between a
          # suite that never ran and a green job.
          if [ "$skipped" -eq "$collected" ]; then
            echo "::error::all $collected collected tests skipped — the engine was never used. See the -rs reasons above; this is not a pass."
            exit 1
          fi

          exit "$status"

      - name: Dump compose logs on failure
        if: failure()
        working-directory: backend
        run: docker compose -f docker-compose.test.yml logs --no-color || true

      - name: Tear down the engine stack
        if: always()
        working-directory: backend
        run: docker compose -f docker-compose.test.yml down -v || true

  frontend:
    name: Frontend (lint, build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned to the version that generated frontend/pnpm-lock.yaml, so
          # `--frozen-lockfile` cannot fail on a pnpm version skew between the
          # developer machine and CI.
          version: 11.8.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # The pnpm project is frontend/, not the repo root, so the cache key
          # must point at the lockfile explicitly. Without this, setup-node
          # looks for pnpm-lock.yaml at the root, fails to find it, and aborts
          # the job before the install step runs.
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore
