# ═══════════════════════════════════════════════════════════════════
# Nova Engine — Docker Compose
# Patched StarRocks 4.1.4 + Apache Ranger 2.9.0 + MinIO + Redis
# ═══════════════════════════════════════════════════════════════════
#
# Services:
#   - minio:          S3-compatible object storage (port 9000/9001)
#   - minio-init:     Auto-creates buckets + service account
#   - redis:          Session store + cache (port 6379)
#   - starrocks-fe:   StarRocks Frontend (8030 HTTP; 9030 stays internal)
#   - starrocks-be:   StarRocks Backend (port 8040 HTTP)
#   - starrocks-init: Auto-creates NOVA_SYSTEM + admin + ACCOUNTADMIN
#
# Quick Start:
#   cp .env.example .env
#   docker compose -f docker-compose-engine.yml up -d
#
# Access:
#   StarRocks FE:    http://localhost:8030
#   Arrow Flight:   grpc://localhost:9408
#   StarRocks BE:    http://localhost:8040
#   MinIO Console:   http://localhost:9001  (see MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)
#   MinIO API:       http://localhost:9000
#   MySQL proxy:     mysql -h localhost -P 4406 -u nova_admin -p
#   Redis:           redis-cli -h localhost -p 6379 -a novaredis
#
# Auth Model:
#   root       → empty password, Docker internal only (NOT exposed externally)
#   nova_admin → default '!1password' (docker/init-nova.sql); change it after first login
#   All login users ARE StarRocks users (no separate user table)
#
# NOVA_SYSTEM tables are grouped by prefixes because StarRocks namespaces
# objects as catalog.database.table and does not provide nested schemas:
#   CONFIG_*, ML_*, AUDIT_*, STAGE_*, LINEAGE_*, QUALITY_*, USAGE_*
# ═══════════════════════════════════════════════════════════════════

name: docker

# Container stdout is rotated: at most three 10 MB files per service. Docker's
# json-file driver otherwise keeps a container's whole output.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  nova-backend:
    logging: *default-logging
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: nova-backend
    depends_on:
      starrocks-init:
        condition: service_completed_successfully
      ranger-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      STARROCKS_HOST: starrocks-fe
      STARROCKS_FE_MYSQL_PORT: 9030
      REDIS_URL: redis://:${REDIS_PASSWORD:-novaredis}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nova}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-novasecret}
      RANGER_ADMIN_URL: http://ranger-admin:6080
      RANGER_SERVICE_NAME: ${RANGER_SERVICE_NAME:-nova_starrocks}
      RANGER_USERNAME: admin
      RANGER_PASSWORD: ${RANGER_ADMIN_PASSWORD:?set RANGER_ADMIN_PASSWORD in docker/.env}
      RANGER_TLS_VERIFY: "false"
      SECRET_KEY: ${NOVA_SECRET_KEY:?set NOVA_SECRET_KEY in docker/.env}
      FERNET_KEY: ${NOVA_FERNET_KEY:?set NOVA_FERNET_KEY in docker/.env}
      NOVA_CONFIG_PATH: /opt/nova/config/nova.yaml
      PROXY_ENABLED: "true"
      # Where the engine's backends reach the AI_* gateway.
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://nova-backend:8000}
      # A provider endpoint on localhost means the host machine, not this container.
      AI_PROVIDER_LOOPBACK_HOST: ${AI_PROVIDER_LOOPBACK_HOST:-host.docker.internal}
      # Shared with Superset for /api/v1/internal/superset (docs/arch-17-superset.md).
      SUPERSET_SERVICE_TOKEN: ${NOVA_SUPERSET_SERVICE_TOKEN:?set NOVA_SUPERSET_SERVICE_TOKEN in docker/.env}
      SUPERSET_INTERNAL_URL: http://superset:8088
      # BI metadata travels with NOVA_SYSTEM snapshots (pg_dump of superset-db).
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-}
      # Superset's scheduled work runs as its owner through this account's
      # per-owner impersonation (S5); never root or nova_admin.
      WORKER_IMPERSONATION_USER: ${WORKER_IMPERSONATION_USER:-}
      WORKER_IMPERSONATION_PASSWORD: ${WORKER_IMPERSONATION_PASSWORD:-}
      WORKER_IMPERSONATION_ROLE: ${WORKER_IMPERSONATION_ROLE:-}
    ports:
      - "127.0.0.1:${NOVA_API_PORT:-8000}:8000"
      - "${NOVA_MYSQL_PORT:-4406}:4406"
    volumes:
      - ./nova.yaml:/opt/nova/config/nova.yaml:ro
    networks:
      - nova

  nova-worker: &nova-worker
    logging: *default-logging
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "app.worker", "--role", "task"]
    init: true
    stop_grace_period: 45s
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health", "task"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      starrocks-init:
        condition: service_completed_successfully
      ranger-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      STARROCKS_HOST: starrocks-fe
      STARROCKS_FE_MYSQL_PORT: 9030
      REDIS_URL: redis://:${REDIS_PASSWORD:-novaredis}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nova}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-novasecret}
      RANGER_ADMIN_URL: http://ranger-admin:6080
      RANGER_SERVICE_NAME: ${RANGER_SERVICE_NAME:-nova_starrocks}
      RANGER_USERNAME: admin
      RANGER_PASSWORD: ${RANGER_ADMIN_PASSWORD:?set RANGER_ADMIN_PASSWORD in docker/.env}
      RANGER_TLS_VERIFY: "false"
      SECRET_KEY: ${NOVA_SECRET_KEY:?set NOVA_SECRET_KEY in docker/.env}
      FERNET_KEY: ${NOVA_FERNET_KEY:?set NOVA_FERNET_KEY in docker/.env}
      NOVA_CONFIG_PATH: /opt/nova/config/nova.yaml
      WORKER_IMPERSONATION_USER: ${WORKER_IMPERSONATION_USER:-}
      WORKER_IMPERSONATION_PASSWORD: ${WORKER_IMPERSONATION_PASSWORD:-}
      WORKER_IMPERSONATION_ROLE: ${WORKER_IMPERSONATION_ROLE:-}
      # A provider endpoint on localhost means the host machine, not this container.
      AI_PROVIDER_LOOPBACK_HOST: ${AI_PROVIDER_LOOPBACK_HOST:-host.docker.internal}
    volumes:
      - ./nova.yaml:/opt/nova/config/nova.yaml:ro
    restart: unless-stopped
    networks:
      - nova

  nova-ingestion-worker:
    <<: *nova-worker
    command: ["python", "-m", "app.worker", "--role", "ingestion"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health", "ingestion"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  nova-ml-worker:
    <<: *nova-worker
    command: ["python", "-m", "app.worker", "--role", "ml"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health", "ml"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 2.0

  nova-notebook-worker:
    <<: *nova-worker
    command: ["python", "-m", "app.worker", "--role", "notebook"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health", "notebook"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  nova-automation-worker:
    <<: *nova-worker
    command: ["python", "-m", "app.worker", "--role", "automation"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health", "automation"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  nova-autopilot-worker:
    <<: *nova-worker
    command: ["python", "-m", "app.worker", "--role", "autopilot"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health", "autopilot"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  nova-maintenance-worker:
    <<: *nova-worker
    command: ["python", "-m", "app.worker", "--role", "maintenance"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health", "maintenance"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  nova-outbox-worker:
    <<: *nova-worker
    entrypoint: []
    command: ["python", "-m", "app.worker", "--role", "outbox"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-novaredis}@redis:6379/0
      NOVA_METADATA_HOST: ${NOVA_METADATA_HOST:-nova-metadata-db}
      NOVA_METADATA_PORT: ${NOVA_METADATA_PORT:-5432}
      NOVA_METADATA_SSLROOTCERT: /opt/nova/metadata-tls/ca.crt
      NOVA_METADATA_SCHEMA_VERSION: ${NOVA_METADATA_SCHEMA_VERSION:-0}
      NOVA_METADATA_EPOCH: ${NOVA_METADATA_EPOCH:-}
      NOVA_METADATA_PASSWORDS: ${NOVA_METADATA_OUTBOX_PASSWORDS:-}
      NOVA_METADATA_POOL_MAX_SIZE: 2
      NOVA_METRICS_HOST: 0.0.0.0
    volumes:
      - ${NOVA_METADATA_CERT_DIR:-./metadata-tls}:/opt/nova/metadata-tls:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.health", "outbox", "--ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  ranger-solr:
    logging: *default-logging
    image: apache/ranger-solr:${RANGER_VERSION:-2.9.0}
    container_name: nova-ranger-solr
    command: solr-precreate ranger_audits /opt/solr/server/solr/configsets/ranger_audits/
    ports:
      - "127.0.0.1:${RANGER_SOLR_PORT:-8983}:8983"
    volumes:
      - ranger_solr_data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8983/solr/ranger_audits/admin/ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - nova

  ranger-db:
    logging: *default-logging
    image: apache/ranger-db:${RANGER_VERSION:-2.9.0}
    container_name: nova-ranger-db
    environment:
      POSTGRES_PASSWORD: ${RANGER_DB_PASSWORD:-rangerR0cks!}
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: ${RANGER_DB_PASSWORD:-rangerR0cks!}
    volumes:
      - ranger_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "su -c 'pg_isready -q' postgres"]
      interval: 10s
      timeout: 3s
      retries: 30
    networks:
      - nova

  ranger-admin:
    logging: *default-logging
    image: apache/ranger:${RANGER_VERSION:-2.9.0}
    container_name: nova-ranger-admin
    hostname: ranger-admin
    entrypoint: ["/bin/bash", "/opt/nova/ranger-admin-start.sh"]
    volumes:
      - ./ranger/admin-start.sh:/opt/nova/ranger-admin-start.sh:ro
    depends_on:
      ranger-db:
        condition: service_healthy
      ranger-solr:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${RANGER_DB_PASSWORD:-rangerR0cks!}
      RANGER_ADMIN_PASSWORD: ${RANGER_ADMIN_PASSWORD:?set RANGER_ADMIN_PASSWORD in docker/.env}
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: ${RANGER_DB_PASSWORD:-rangerR0cks!}
    ports:
      - "127.0.0.1:${RANGER_ADMIN_PORT:-6080}:6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"admin:$${RANGER_ADMIN_PASSWORD}\" http://localhost:6080/service/public/v2/api/service >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks:
      - nova
      - ranger-policy

  ranger-policy-proxy:
    logging: *default-logging
    build:
      context: ..
      dockerfile: docker/ranger/policy-proxy.Dockerfile
    container_name: nova-ranger-policy-proxy
    depends_on:
      ranger-admin:
        condition: service_healthy
    environment:
      RANGER_ADMIN_URL: http://ranger-admin:6080
      RANGER_USERNAME: admin
      RANGER_PASSWORD: ${RANGER_ADMIN_PASSWORD:?set RANGER_ADMIN_PASSWORD in docker/.env}
    expose:
      - "6081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6081/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - ranger-policy

  ranger-bootstrap:
    logging: *default-logging
    build:
      context: ..
      dockerfile: docker/ranger/bootstrap.Dockerfile
    container_name: nova-ranger-bootstrap
    depends_on:
      ranger-admin:
        condition: service_healthy
    environment:
      RANGER_ADMIN_URL: http://ranger-admin:6080
      RANGER_USERNAME: admin
      RANGER_PASSWORD: ${RANGER_ADMIN_PASSWORD:?set RANGER_ADMIN_PASSWORD in docker/.env}
      RANGER_SERVICE_NAME: ${RANGER_SERVICE_NAME:-nova_starrocks}
    restart: "no"
    networks:
      - nova

  # ── MinIO (S3-compatible object storage) ──────────────────────────
  minio:
    logging: *default-logging
    image: ghcr.io/teableio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nova-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
      # Override ALL built-in _FILE env vars from MinIO image
      # Use space character to effectively blank them (empty string removes the var)
      MINIO_ROOT_USER_FILE: " "
      MINIO_ROOT_PASSWORD_FILE: " "
      MINIO_ACCESS_KEY_FILE: " "
      MINIO_SECRET_KEY_FILE: " "
      MINIO_KMS_SECRET_KEY_FILE: " "
    volumes:
      - minio_data:/data
      - /usr/share/zoneinfo/Asia/Jakarta:/usr/share/zoneinfo/Asia/Jakarta:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nova

  # ── MinIO Init (auto-create buckets + service account) ────────────
  minio-init:
    logging: *default-logging
    image: ghcr.io/teableio/minio-mc:RELEASE.2025-04-16T18-13-26Z
    container_name: nova-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set nova http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};

      mc mb --ignore-existing nova/stages;
      mc mb --ignore-existing nova/exports;
      mc mb --ignore-existing nova/temp;

      mc admin user add nova $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc admin policy attach nova readwrite --user $${MINIO_ACCESS_KEY};

      echo 'MinIO init complete!';
      "
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nova}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-novasecret}
    volumes:
      - /usr/share/zoneinfo/Asia/Jakarta:/usr/share/zoneinfo/Asia/Jakarta:ro
    networks:
      - nova

  # ── Superset BI surface (docs/arch-17-superset.md) ────────────────
  # Superset's own metadata (charts, dashboards, datasets). Users, roles,
  # passwords and data policy stay in StarRocks and Ranger.
  superset-db:
    logging: *default-logging
    profiles: ["app"]
    image: postgres:16.10-alpine
    container_name: nova-superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:?set SUPERSET_DB_PASSWORD in docker/.env}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - nova

  superset-init:
    logging: *default-logging
    profiles: ["app"]
    # The web image has no browser; the worker builds the `jobs` target.
    build:
      context: ..
      dockerfile: superset/Dockerfile
      target: web
    image: nova-superset:local
    container_name: nova-superset-init
    command: ["/app/nova/bootstrap.sh"]
    depends_on:
      superset-db:
        condition: service_healthy
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY in docker/.env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?set SUPERSET_DB_PASSWORD in docker/.env}
      SUPERSET_DB_HOST: superset-db
      SUPERSET_REDIS_URL: redis://:${REDIS_PASSWORD:-novaredis}@redis:6379
      SUPERSET_APP_ROOT: /bi
      NOVA_API_URL: http://nova-backend:8000
      NOVA_PROXY_HOST: nova-backend
      NOVA_PROXY_PORT: "4406"
      NOVA_SUPERSET_SERVICE_TOKEN: ${NOVA_SUPERSET_SERVICE_TOKEN:?set NOVA_SUPERSET_SERVICE_TOKEN in docker/.env}
      # Metrics go to the observability stack's statsd exporter when it runs.
      SUPERSET_STATSD_HOST: ${SUPERSET_STATSD_HOST:-statsd-exporter}
      SUPERSET_SMTP_HOST: ${SUPERSET_SMTP_HOST:-}
      SUPERSET_SMTP_PORT: ${SUPERSET_SMTP_PORT:-587}
      SUPERSET_SMTP_USER: ${SUPERSET_SMTP_USER:-}
      SUPERSET_SMTP_PASSWORD: ${SUPERSET_SMTP_PASSWORD:-}
      SUPERSET_SMTP_MAIL_FROM: ${SUPERSET_SMTP_MAIL_FROM:-nova-bi@localhost}
    networks:
      - nova

  superset:
    logging: *default-logging
    profiles: ["app"]
    image: nova-superset:local
    container_name: nova-superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *superset-env
    # Loopback only: browsers reach it through Nova at /bi.
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/bi/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - nova

  # Alerts, reports, thumbnails and async SQL Lab, all in use (see
  # docs/operations/superset-feature-inventory.md). Cache warmup is not
  # scheduled. One process idles; a second starts under load.
  superset-worker:
    logging: *default-logging
    profiles: ["app"]
    build:
      context: ..
      dockerfile: superset/Dockerfile
      target: jobs
    image: nova-superset-jobs:local
    container_name: nova-superset-worker
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--pool=prefork", "-O", "fair", "--autoscale=2,1", "--max-memory-per-child=716800", "-l", "INFO"]
    # The worker answers a ping over its broker. Loading the whole Superset app
    # for every check cost 13.9 CPU-seconds and 258 MB each time; this costs 1.6.
    healthcheck:
      test: ["CMD-SHELL", "celery --broker=\"$${SUPERSET_REDIS_URL}/6\" inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *superset-env
    restart: unless-stopped
    networks:
      - nova

  superset-beat:
    logging: *default-logging
    profiles: ["app"]
    image: nova-superset:local
    container_name: nova-superset-beat
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "--pidfile", "/tmp/celerybeat.pid", "-s", "/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *superset-env
    restart: unless-stopped
    networks:
      - nova

  # ── OpenSandbox server (Nova Notebook runtimes) ──────────────────
  # Trusted control plane: the only container with the Docker socket. It
  # creates one sibling sandbox per active notebook runtime from the pinned
  # nova-notebook-runtime image (docker/notebook-runtime). Published on
  # loopback only; the backend is its sole caller (docs/arch-20-nova-notebook.md).
  opensandbox-server:
    logging: *default-logging
    image: opensandbox/server:release-1.2.0@sha256:25bebdcf1cf7724eb923faecbdbbf82d4038c6ab35c736151574726d14006f30
    container_name: nova-opensandbox-server
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${NOVA_OPENSANDBOX_API_KEY:?set NOVA_OPENSANDBOX_API_KEY in docker/.env}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${OPENSANDBOX_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox/config.toml:/etc/opensandbox/config.toml:ro
      - opensandbox_data:/var/lib/opensandbox
    restart: unless-stopped
    networks:
      - nova

  # ── Redis (session store + cache) ─────────────────────────────────
  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: nova-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-novaredis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-novaredis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nova

  # ── StarRocks FE (Frontend — query, metadata, auth) ──────────────
  starrocks-fe:
    logging: *default-logging
    build:
      context: ..
      dockerfile: docker/ranger/starrocks-fe.Dockerfile
      args:
        STARROCKS_VERSION: 4.1.4
        STARROCKS_COMMIT: 4a9848edf03f5c936dac664b2d52527f48e72eb0
    container_name: nova-starrocks-fe
    hostname: starrocks-fe
    depends_on:
      ranger-bootstrap:
        condition: service_completed_successfully
      ranger-policy-proxy:
        condition: service_healthy
    ports:
      - "8030:8030"   # HTTP API
      - "9020:9020"   # FE edit log port
      - "9408:9408"   # Arrow Flight SQL
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      HOST_TYPE: FQDN
      ENV_TYPE: docker_compose_deploy
      ENABLE_DEBUG_SOCKET: "false"
      JAVA_OPTS: "-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 --add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED"
      JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED"
    ulimits:
      nproc:
        soft: 65535
        hard: 65535
      nofile:
        soft: 655350
        hard: 655350
    volumes:
      - fe_meta:/opt/starrocks/fe/meta
      - fe_log:/opt/starrocks/fe/log
      - ./fe.conf:/opt/starrocks/fe/conf/fe.conf:ro
      - ./ranger/ranger-starrocks-security.xml:/opt/starrocks/fe/conf/ranger-starrocks-security.xml:ro
      - ./ranger/ranger-starrocks-audit.xml:/opt/starrocks/fe/conf/ranger-starrocks-audit.xml:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/starrocks/fe_entrypoint.sh starrocks-fe && tail -F /opt/starrocks/fe/log/fe.log"]
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9030", "-u", "root", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - nova
      - ranger-policy

  # ── StarRocks BE (Backend — storage, compute) ────────────────────
  starrocks-be:
    logging: *default-logging
    # Upstream BE plus the bundled JDBC drivers for Nova Catalog connections.
    build:
      context: ..
      dockerfile: docker/starrocks-be.Dockerfile
      args:
        STARROCKS_VERSION: 4.1.4
    container_name: nova-starrocks-be
    hostname: starrocks-be
    depends_on:
      starrocks-fe:
        condition: service_healthy
    ports:
      - "8040:8040"   # HTTP API
      - "9050:9050"   # Heartbeat port
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      HOST_TYPE: FQDN
      ENV_TYPE: docker_compose_deploy
      ENABLE_DEBUG_SOCKET: "false"
    ulimits:
      nproc:
        soft: 65535
        hard: 65535
      nofile:
        soft: 655350
        hard: 655350
    volumes:
      - be_storage:/opt/starrocks/be/storage
      - be_log:/opt/starrocks/be/log
      - ./be.conf:/opt/starrocks/be/conf/be.conf:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/starrocks/be_entrypoint.sh starrocks-fe && tail -F /opt/starrocks/be/log/be.log"]
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8040/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - nova

  # ── Nova Catalog acceptance source (profile `catalog-test`) ──────
  # A disposable PostgreSQL for the phase 2 governed acceptance
  # (backend/scripts/verify_catalog_jdbc_e2e.py). Started only with
  # `--profile catalog-test`; no published port and no volume, so it is
  # reachable only from the engine network and reseeds on every recreate.
  # The passwords are local test fixtures; override them in docker/.env.
  catalog-test-postgres:
    logging: *default-logging
    image: postgres:16.10-alpine
    container_name: nova-catalog-test-postgres
    hostname: catalog-test-postgres
    profiles: ["catalog-test"]
    environment:
      POSTGRES_USER: nova_catalog_owner
      POSTGRES_PASSWORD: ${CATALOG_TEST_POSTGRES_PASSWORD:-nova-catalog-owner-test}
      POSTGRES_DB: shop
      CATALOG_TEST_READER_PASSWORD: ${CATALOG_TEST_READER_PASSWORD:-nova-catalog-reader-test}
    volumes:
      - ./catalog-test/postgres-init.sh:/docker-entrypoint-initdb.d/10-seed.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nova_catalog_owner", "-d", "shop"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nova

  # ── StarRocks Init (auto-create NOVA_SYSTEM + admin) ─────────────
  starrocks-init:
    logging: *default-logging
    image: mysql:8.0
    container_name: nova-starrocks-init
    depends_on:
      starrocks-fe:
        condition: service_healthy
      starrocks-be:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./init-entrypoint.sh:/init-entrypoint.sh:ro
      - ./init-nova.sql:/docker-entrypoint-initdb.d/init-nova.sql:ro
    networks:
      - nova

networks:
  nova:
  ranger-policy:
    internal: true

volumes:
  ranger_solr_data:
    name: docker_ranger_solr_data
  ranger_db_data:
    name: docker_ranger_db_data
  fe_meta:
    name: docker_ranger_fe_meta
  fe_log:
    name: docker_ranger_fe_log
  be_storage:
    name: docker_ranger_be_storage
  be_log:
    name: docker_ranger_be_log
  minio_data:
    name: docker_minio_data
  redis_data:
    name: docker_redis_data
  superset_db_data:
    name: docker_superset_db_data
  opensandbox_data:
    name: docker_opensandbox_data
