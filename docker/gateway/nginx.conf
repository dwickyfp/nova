# Gateway for a split Nova deployment (docker-compose.split.yml): routes the
# API by path and balances MySQL clients across the proxy replicas.
events {}

http {
  # Docker's embedded DNS.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # `resolve` re-reads Docker DNS, so replicas added with `--scale` join
  # without a gateway restart.
  upstream nova_web {
    zone nova_web 64k;
    server nova-backend:8000 resolve;
  }

  upstream nova_query {
    zone nova_query 64k;
    server nova-query:8000 resolve;
  }

  # Assistant and agent runs keep their pending consent prompts, grants and
  # cancel flags in the process that runs them, so every request of one
  # signed-in session must reach the same replica. The bearer token is the
  # session's key. When the replica set changes, sessions move and a prompt
  # that was waiting on the old replica is refused rather than answered
  # elsewhere.
  #
  # Not `hash ... consistent`: that variant places peers on its ring by server
  # name, and every replica here shares one name, so it balances them round
  # robin and pins nothing. The plain hash indexes the resolved addresses.
  upstream nova_execution {
    zone nova_execution 64k;
    hash $http_authorization;
    server nova-query:8000 resolve;
  }

  server {
    listen 8000;
    include /etc/nginx/nova-routes.conf;
  }

  # Optional HTTPS listener: see tls.conf.example. Empty by default.
  include /etc/nginx/nova-tls/*.conf;
}

stream {
  resolver 127.0.0.11 valid=10s ipv6=off;

  # MySQL protocol, passed through untouched: the proxy still authenticates
  # every client against the engine.
  server {
    listen 4406;
    proxy_connect_timeout 5s;
    # A BI session can sit idle between statements far longer than the default.
    proxy_timeout 1h;
    set $nova_mysql nova-proxy:4406;
    proxy_pass $nova_mysql;
  }
}
