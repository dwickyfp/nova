# Path router for a split Nova deployment (docker-compose.split.yml).
#
# SQL and ML execution goes to the query tier; everything else goes to the web
# process. The alternation is anchored on a path boundary so that
# /api/v1/query-autopilot stays on the web process.
events {}

http {
  # Docker's embedded DNS, re-resolved so replicas added with
  # `--scale nova-query=N` receive traffic without a gateway restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8000;

    # The API imposes no body limit of its own; the gateway must not add one.
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    # Studio streams its answers and a query can outlast any short timeout.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/api/v1/(query|ml)(/|$) {
      set $nova_upstream nova-query:8000;
      proxy_pass http://$nova_upstream;
    }

    location / {
      set $nova_upstream nova-backend:8000;
      proxy_pass http://$nova_upstream;
    }
  }
}
