# Routing shared by the plain and TLS listeners of the Nova gateway.
#
# SQL and ML go to the query tier; application metadata stays on web.
# The alternations are anchored on a path boundary so that
# /api/v1/query-autopilot stays on the web tier.

# The API imposes no body limit of its own; the gateway must not add one.
client_max_body_size 0;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
# Studio streams its answers and a query can outlast any short timeout.
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_connect_timeout 5s;
# Try another replica when one refuses the connection or is still starting.
# nginx only repeats requests that are safe to repeat, so a statement a
# replica already received is never sent twice.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;

# Machine-to-machine routes (the engine's AI_* calls, the ML UDF bridge) are
# reached on the internal network, never through this gateway.
location ^~ /api/v1/internal/ {
  return 404;
}

location ~ ^/api/v1/(query|ml)(/|$) {
  proxy_pass http://nova_query;
}

# Interactive Agent/assistant metadata uses the web workload login. Keep its
# process-local consent and cancellation pinned until durable Agent separation.
location ~ ^/api/v1/(assistant|agents|intelligence/actions)(/|$) {
  proxy_pass http://nova_execution;
}

# Superset (docs/arch-17-superset.md). Resolved per request, so the gateway
# also starts when Superset is not running.
location ^~ /bi/ {
  set $nova_bi superset:8088;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_pass http://$nova_bi;
}

location / {
  proxy_pass http://nova_web;
}
